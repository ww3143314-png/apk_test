name: 编译生成 SparkCapsule Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 自动化打包 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目源代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖并构建前端产物
        run: |
          npm install
          npm run build

      - name: 配置 Java JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 同步前端产物至 Android 容器
        run: |
          npx cap sync android

      - name: 执行 Gradle 编译生成 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 SparkCapsule APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: SparkCapsule-v1.0-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
